AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: >
  CSUCI Student Success Navigator — Serverless backend.
  Deploys API Gateway, Lambda orchestrator, and SNS escalation topic
  for the AI-powered student advising chatbot. All interactions are
  logged to CloudWatch for observability.

# ---------------------------------------------------------------------------
# Parameters
# ---------------------------------------------------------------------------
Parameters:
  Environment:
    Type: String
    Default: dev
    AllowedValues:
      - dev
      - prod
    Description: Deployment environment (dev or prod).

  BedrockKBId:
    Type: String
    Description: >
      The ID of the Amazon Bedrock Knowledge Base that contains
      CSUCI catalog and policy documents.
    MinLength: 1

  ModelId:
    Type: String
    Default: us.anthropic.claude-sonnet-5
    Description: >
      The Bedrock model identifier used for response generation.
      Claude models on Bedrock are inference-profile only, so this
      must be the "us."-prefixed cross-region inference profile ID
      (Claude Sonnet 5 by default). The model must support Converse
      tool-use.

  GuardrailId:
    Type: String
    Description: >
      The ID of the Amazon Bedrock Guardrail applied to Converse calls
      (content filters, denied topics, PII masking, contextual grounding).
    MinLength: 1

  GuardrailVersion:
    Type: String
    Default: DRAFT
    Description: >
      The Bedrock Guardrail version to use. Defaults to DRAFT; use a
      numbered version (e.g. "1") for production/demo deployments.

# ---------------------------------------------------------------------------
# Global settings
# ---------------------------------------------------------------------------
Globals:
  Function:
    Runtime: python3.12
    Timeout: 30
    MemorySize: 512
    Architectures:
      - x86_64
    Tags:
      Project: StudentSuccessNavigator
      Environment: !Ref Environment

  Api:
    # Default CORS applied to Globals; ChatRestApi below overrides explicitly.
    Cors:
      AllowOrigin: "'*'"
      AllowHeaders: "'Content-Type,Authorization'"
      AllowMethods: "'POST,OPTIONS'"

# ---------------------------------------------------------------------------
# Resources
# ---------------------------------------------------------------------------
Resources:

  # -------------------------------------------------------------------------
  # SNS — Human-escalation notifications
  # -------------------------------------------------------------------------
  EscalationTopic:
    Type: AWS::SNS::Topic
    Properties:
      DisplayName: Student Navigator Escalation
      TopicName: !Sub student-navigator-escalation-${Environment}
      Tags:
        - Key: Project
          Value: StudentSuccessNavigator
        - Key: Environment
          Value: !Ref Environment

  # -------------------------------------------------------------------------
  # Lambda — Orchestrator function
  # -------------------------------------------------------------------------
  OrchestratorFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub student-navigator-orchestrator-${Environment}
      Description: >
        Main orchestrator for the Student Success Navigator chatbot.
        Receives user messages, runs safety checks, retrieves context
        from the Bedrock Knowledge Base, generates a response via Claude,
        and logs all interactions to CloudWatch.
      Handler: orchestrator.handler.lambda_handler
      CodeUri: ../lambda/
      Environment:
        Variables:
          BEDROCK_KB_ID: !Ref BedrockKBId
          MODEL_ID: !Ref ModelId
          GUARDRAIL_ID: !Ref GuardrailId
          GUARDRAIL_VERSION: !Ref GuardrailVersion
          SNS_TOPIC_ARN: !Ref EscalationTopic
          ENVIRONMENT: !Ref Environment
      Policies:
        # --- Bedrock InvokeModel ---
        # Inference profiles resolve to foundation models in multiple regions,
        # so the policy must allow both the profile ARN and the underlying
        # cross-region foundation-model ARNs.
        - Statement:
            - Effect: Allow
              Action:
                - bedrock:InvokeModel
                - bedrock:InvokeModelWithResponseStream
              Resource:
                - !Sub arn:aws:bedrock:${AWS::Region}:${AWS::AccountId}:inference-profile/${ModelId}
                - arn:aws:bedrock:*::foundation-model/anthropic.*
        # --- Bedrock Retrieve (Knowledge Base) ---
        - Statement:
            - Effect: Allow
              Action:
                - bedrock:Retrieve
              Resource: !Sub arn:aws:bedrock:${AWS::Region}:${AWS::AccountId}:knowledge-base/${BedrockKBId}
        # --- Bedrock Guardrail ---
        # This guardrail has cross-region inference enabled (Bedrock console:
        # "US Guardrail v1:0" profile, AWS Regions us-east-1/us-east-2/
        # us-west-2). Bedrock routes each ApplyGuardrail call to whichever of
        # those three regions has capacity, so the profile ARN's region
        # segment varies non-deterministically between calls (confirmed via
        # CloudWatch: same request type denied against us-east-1 then
        # us-east-2 then us-east-1 again across consecutive invocations) —
        # all three must be granted explicitly.
        - Statement:
            - Effect: Allow
              Action:
                - bedrock:ApplyGuardrail
              Resource:
                - !Sub arn:aws:bedrock:${AWS::Region}:${AWS::AccountId}:guardrail/${GuardrailId}
                - !Sub arn:aws:bedrock:us-east-1:${AWS::AccountId}:guardrail-profile/us.guardrail.v1:0
                - !Sub arn:aws:bedrock:us-east-2:${AWS::AccountId}:guardrail-profile/us.guardrail.v1:0
                - !Sub arn:aws:bedrock:us-west-2:${AWS::AccountId}:guardrail-profile/us.guardrail.v1:0
        # --- SNS Publish ---
        - SNSPublishMessagePolicy:
            TopicName: !GetAtt EscalationTopic.TopicName
      Events:
        ChatApi:
          Type: Api
          Properties:
            Path: /chat
            Method: POST
            RestApiId: !Ref ChatRestApi
      Tags:
        Project: StudentSuccessNavigator
        Environment: !Ref Environment

  # -------------------------------------------------------------------------
  # API Gateway — Explicit definition for CORS + stage control
  # -------------------------------------------------------------------------
  ChatRestApi:
    Type: AWS::Serverless::Api
    Properties:
      Name: !Sub student-navigator-api-${Environment}
      StageName: prod
      Cors:
        AllowOrigin: "'*'"
        AllowHeaders: "'Content-Type,Authorization'"
        AllowMethods: "'POST,OPTIONS'"
      Tags:
        Project: StudentSuccessNavigator
        Environment: !Ref Environment

# ---------------------------------------------------------------------------
# Outputs
# ---------------------------------------------------------------------------
Outputs:
  ApiEndpointUrl:
    Description: URL of the /chat API endpoint.
    Value: !Sub https://${ChatRestApi}.execute-api.${AWS::Region}.amazonaws.com/prod/chat

  OrchestratorFunctionArn:
    Description: ARN of the Orchestrator Lambda function.
    Value: !GetAtt OrchestratorFunction.Arn

  EscalationTopicArn:
    Description: ARN of the SNS escalation topic.
    Value: !Ref EscalationTopic

  CloudWatchLogGroup:
    Description: CloudWatch Log Group for reviewing chatbot interactions.
    Value: !Sub /aws/lambda/student-navigator-orchestrator-${Environment}
